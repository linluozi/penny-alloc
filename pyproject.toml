[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "penny-alloc"
version = "0.2.0"
description = "Exact proportional allocation of integer minor units, with a quota audit"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "linluozi"}]
keywords = ["allocation", "money", "largest-remainder", "accounting", "fractions"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/linluozi/penny-alloc"

[tool.setuptools]
packages = ["penny_alloc"]
